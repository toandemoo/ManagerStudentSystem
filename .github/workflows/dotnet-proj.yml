
name: ASP.NET Core CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ManagerStudentSystem.csproj

      - name: Build
        run: dotnet build ManagerStudentSystem.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ManagerStudentSystem.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish ManagerStudentSystem.csproj -c Release -o ./publish
